<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>献立 → 食材合計計算ツール</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; line-height: 1.35; }
    .row { display:flex; gap:12px; flex-wrap: wrap; align-items: end; }
    label { display:block; font-size: 12px; opacity:.8; margin-bottom: 4px; }
    select, input, button, textarea { padding: 8px 10px; font-size: 14px; }
    button { cursor:pointer; }
    .card { border:1px solid #ddd; border-radius: 12px; padding: 12px; margin-top: 12px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #eee; padding: 8px; text-align:left; vertical-align: top; }
    th { background:#fafafa; }
    .muted { opacity:.75; font-size: 12px; }
    .right { text-align:right; }
    .pill { display:inline-block; padding: 2px 8px; border:1px solid #ddd; border-radius: 999px; font-size: 12px; }
    .ok { border-color:#bfe7c8; background:#f4fff6; }
    .danger { border-color:#f2c2c2; background:#fff5f5; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .small { font-size: 12px; padding: 6px 8px; }
    textarea { width: 100%; height: 140px; }
    .namewrap { display:flex; gap:8px; align-items:center; }
    .icon { width: 1.2em; text-align:center; }
  </style>
</head>
<body>
  <h1 style="margin:0 0 6px;">献立 → 食材合計計算ツール</h1>
  <div class="muted">
    ✅ いちど取ったデータは iPhone に保存（次回は早い）<br>
    ✅ レシピが増えても「🔄 最新データを読み込む」で対応<br>
    ✅ 日本語辞書は「📘 辞書を作る」で自動生成して ja.json に貼るだけ
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div>
        <div class="pill ok" id="statusPill">準備中…</div>
        <div class="muted" id="statusText" style="margin-top:6px;"></div>
      </div>
      <div class="actions">
        <button id="refresh" class="small">🔄 最新データを読み込む</button>
        <button id="makeDict" class="small">📘 辞書を作る</button>
        <button id="clearCache" class="small danger">🗑 保存データを消す</button>
      </div>
    </div>

    <hr style="border:none;border-top:1px solid #eee;margin:12px 0;">

    <div class="row">
      <div>
        <label>カテゴリ</label>
        <select id="category"></select>
      </div>
      <div style="min-width: 260px;">
        <label>レシピ</label>
        <select id="recipe"></select>
      </div>
      <div>
        <label>回数</label>
        <input id="times" type="number" min="1" max="99" value="1" style="width:90px;" />
      </div>
      <div class="actions">
        <button id="add" class="ok">追加</button>
        <button id="clearAll" class="danger">全クリア</button>
      </div>
    </div>

    <div class="muted" style="margin-top:8px;">
      ※「Mixed Curry / Mixed Salad」など材料が定義されないものは集計対象外（=ごちゃまぜ）として扱います。
    </div>

    <details style="margin-top:12px;">
      <summary class="muted">（もしネットがダメなら）JSONを貼り付けて読み込む</summary>
      <div style="margin-top:8px;">
        <textarea id="pasteArea" placeholder="recipes.json の中身をここに貼り付け"></textarea>
        <div class="actions" style="margin-top:8px;">
          <button id="loadPaste" class="small">📥 貼り付けから読み込む</button>
        </div>
      </div>
    </details>
  </div>

  <div class="card">
    <h2 style="margin:0 0 8px; font-size: 16px;">献立リスト</h2>
    <table id="planTable">
      <thead>
        <tr>
          <th>カテゴリ</th>
          <th>レシピ</th>
          <th class="right">回数</th>
          <th>材料（1回あたり）</th>
          <th class="right">操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="muted" style="margin-top:8px;">行を消すと自動で合計が更新されます。</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin:0; font-size: 16px;">食材 合計</h2>
      <div class="actions">
        <button id="copy" class="small">コピー</button>
        <button id="download" class="small">CSV出力</button>
      </div>
    </div>
    <div style="margin-top:10px;">
      <div class="pill">総食材数（合計個数）: <span id="grandTotal">0</span></div>
    </div>

    <table id="sumTable" style="margin-top:10px;">
      <thead>
        <tr>
          <th>食材</th>
          <th class="right">合計</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
/** ====== 設定（ここが「今後のアップデート対応」のポイント） ======
 *  このURLの中身が更新されたら、新しいレシピが自動で増えます。
 */
const RECIPES_URL = "https://raw.githubusercontent.com/EntropyBall/PokemonSleepAPI/master/data/recipes.json";

/** アイコン用（英語名→絵文字）※分からないものは🥕 */
const ING_EMOJI_FALLBACK = (name) => {
  const n = String(name || "");
  if (/Apple/i.test(n)) return "🍎";
  if (/Egg/i.test(n)) return "🥚";
  if (/Honey/i.test(n)) return "🍯";
  if (/Potato/i.test(n)) return "🥔";
  if (/Milk/i.test(n)) return "🥛";
  if (/Soy|Bean/i.test(n)) return "🫘";
  if (/Tomato/i.test(n)) return "🍅";
  if (/Mushroom/i.test(n)) return "🍄";
  if (/Cacao|Chocolate/i.test(n)) return "🍫";
  if (/Ginger/i.test(n)) return "🫚";
  if (/Herb|Leaf|Greens/i.test(n)) return "🥬";
  return "🥕";
};

/** 日本語辞書（自分のGitHubに置いた ja.json） */
const JA_URL = "./ja.json";

/** ====== 画面要素 ====== */
const $ = (sel) => document.querySelector(sel);
const categorySel = $("#category");
const recipeSel = $("#recipe");
const timesInput = $("#times");
const planBody = $("#planTable tbody");
const sumBody = $("#sumTable tbody");
const grandTotalEl = $("#grandTotal");
const statusPill = $("#statusPill");
const statusText = $("#statusText");

/** ====== データ ====== */
let data = [];                 // recipes.json
let plan = [];                 // 献立
let ja = { categories:{}, recipes:{}, ingredients:{} }; // ja.json
let ingEmojiMap = new Map();   // 食材→絵文字

function setStatus(ok, text) {
  statusPill.className = "pill " + (ok ? "ok" : "danger");
  statusPill.textContent = ok ? "OK" : "注意";
  statusText.textContent = text;
}

/** ====== 翻訳（ja.jsonがあれば日本語にする） ====== */
function tCat(en){ return ja?.categories?.[en] || en; }
function tRecipe(en){ return ja?.recipes?.[en] || en; }
function tIng(en){ return ja?.ingredients?.[en] || en; }

/** ====== 表示用 ====== */
function safeIngredients(recipe) { return Array.isArray(recipe.ingredients) ? recipe.ingredients : []; }
function ingredientText(ings) {
  if (!ings.length) return "（ごちゃまぜ / 材料未定義）";
  return ings.map(i => `${tIng(i.name)}×${i.quantity}`).join(", ");
}

function renderRecipeOptions() {
  recipeSel.innerHTML = "";
  const catIdx = Number(categorySel.value);
  const cat = data[catIdx];
  if (!cat || !Array.isArray(cat.recipes)) return;

  cat.recipes.forEach((r, idx) => {
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = tRecipe(r.name);
    recipeSel.appendChild(opt);
  });
}

function renderCategories() {
  categorySel.innerHTML = "";
  data.forEach((c, idx) => {
    const opt = document.createElement("option");
    opt.value = String(idx);
    opt.textContent = tCat(c.title);
    categorySel.appendChild(opt);
  });
  renderRecipeOptions();
}

/** 英語名でレシピを探す（planは英語で保存する） */
function findRecipeByEnglish(catEn, recipeEn) {
  const cat = data.find(c => c.title === catEn);
  return cat?.recipes?.find(r => r.name === recipeEn) ?? null;
}

function renderPlan() {
  planBody.innerHTML = "";
  plan.forEach((item, idx) => {
    const tr = document.createElement("tr");

    const catTd = document.createElement("td");
    catTd.textContent = tCat(item.catEn);

    const nameTd = document.createElement("td");
    const nameWrap = document.createElement("div");
    nameWrap.className = "namewrap";
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = "🍽️"; // レシピ用アイコン
    const text = document.createElement("span");
    text.textContent = tRecipe(item.recipeEn);
    nameWrap.append(icon, text);
    nameTd.appendChild(nameWrap);

    const timesTd = document.createElement("td");
    timesTd.className = "right";
    timesTd.textContent = String(item.times);

    const ingTd = document.createElement("td");
    const recipe = findRecipeByEnglish(item.catEn, item.recipeEn);
    ingTd.textContent = recipe ? ingredientText(safeIngredients(recipe)) : "（不明）";

    const actTd = document.createElement("td");
    actTd.className = "right";
    const btn = document.createElement("button");
    btn.textContent = "削除";
    btn.className = "small";
    btn.onclick = () => {
      plan.splice(idx, 1);
      renderPlan();
      renderSummary();
      savePlan();
    };
    actTd.appendChild(btn);

    tr.append(catTd, nameTd, timesTd, ingTd, actTd);
    planBody.appendChild(tr);
  });
}

function computeSummary() {
  const totals = new Map();
  let grand = 0;

  for (const item of plan) {
    const recipe = findRecipeByEnglish(item.catEn, item.recipeEn);
    if (!recipe) continue;
    const ings = safeIngredients(recipe);

    for (const ing of ings) {
      const q = Number(ing.quantity) * item.times;
      if (!Number.isFinite(q)) continue;
      totals.set(ing.name, (totals.get(ing.name) ?? 0) + q);
      grand += q;
    }
  }
  const rows = [...totals.entries()].sort((a,b) => a[0].localeCompare(b[0], "en"));
  return { rows, grand };
}

function renderSummary() {
  const { rows, grand } = computeSummary();
  sumBody.innerHTML = "";
  grandTotalEl.textContent = String(grand);

  for (const [nameEn, qty] of rows) {
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "namewrap";

    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = ingEmojiMap.get(nameEn) ?? ING_EMOJI_FALLBACK(nameEn);

    const txt = document.createElement("span");
    txt.textContent = tIng(nameEn);

    wrap.append(icon, txt);
    nameTd.appendChild(wrap);

    const qtyTd = document.createElement("td");
    qtyTd.className = "right";
    qtyTd.textContent = String(qty);

    tr.append(nameTd, qtyTd);
    sumBody.appendChild(tr);
  }
}

function toCSV() {
  const { rows } = computeSummary();
  const header = ["ingredient", "total"];
  const lines = [header.join(",")];
  for (const [name, qty] of rows) {
    const esc = (s) => `"${String(s).replaceAll('"','""')}"`;
    lines.push([esc(tIng(name)), String(qty)].join(","));
  }
  return lines.join("\n");
}

async function copySummary() {
  const { rows, grand } = computeSummary();
  const text = `総食材数: ${grand}\n` + rows.map(([n,q]) => `${tIng(n)}\t${q}`).join("\n");
  await navigator.clipboard.writeText(text);
  alert("コピーしました");
}

function downloadCSV() {
  const csv = toCSV();
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ingredients_total.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/** ====== iPhoneに保存（キャッシュ） ====== */
const LS_KEY_DATA = "kondate_recipes_json_v2";
const LS_KEY_DATA_TIME = "kondate_recipes_time_v2";
const LS_KEY_PLAN = "kondate_plan_v2";
const LS_KEY_JA = "kondate_ja_v2";

function saveJSON(key, obj){ localStorage.setItem(key, JSON.stringify(obj)); }
function loadJSON(key){
  const s = localStorage.getItem(key);
  if (!s) return null;
  try { return JSON.parse(s); } catch { return null; }
}
function saveDataToLocalStorage(obj) {
  saveJSON(LS_KEY_DATA, obj);
  localStorage.setItem(LS_KEY_DATA_TIME, String(Date.now()));
}
function loadDataFromLocalStorage() { return loadJSON(LS_KEY_DATA); }
function getSavedTime() {
  const t = Number(localStorage.getItem(LS_KEY_DATA_TIME));
  return Number.isFinite(t) ? t : null;
}
function savePlan() { saveJSON(LS_KEY_PLAN, plan); }
function loadPlan() { return loadJSON(LS_KEY_PLAN) ?? []; }
function saveJaToLocalStorage(obj){ saveJSON(LS_KEY_JA, obj); }
function loadJaFromLocalStorage(){ return loadJSON(LS_KEY_JA); }

function formatTime(ms) {
  try { return new Date(ms).toLocaleString("ja-JP"); } catch { return ""; }
}

/** ====== ネットから取得（アップデート対応） ====== */
async function fetchLatestRecipes() {
  setStatus(true, "最新レシピを取得中…（ネットが必要です）");
  const res = await fetch(RECIPES_URL, { cache: "no-store" });
  if (!res.ok) throw new Error("recipes.json をネットから取れませんでした");
  const json = await res.json();
  if (!Array.isArray(json) || !json.length) throw new Error("recipes.json の形が変です");
  return json;
}

/** ja.json を取りに行く（自分のGitHub Pagesに置いたもの） */
async function fetchJa() {
  try {
    const res = await fetch(JA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("ja.json が見つからない");
    const j = await res.json();
    if (!j || typeof j !== "object") throw new Error("ja.json が変");
    return {
      categories: j.categories ?? {},
      recipes: j.recipes ?? {},
      ingredients: j.ingredients ?? {}
    };
  } catch {
    return { categories:{}, recipes:{}, ingredients:{} };
  }
}

/** アイコン用：ここは「とりあえず絵文字」で作る（確実に動く） */
function rebuildIconMapFromData() {
  ingEmojiMap = new Map();
  for (const c of (data ?? [])) {
    for (const r of (c?.recipes ?? [])) {
      for (const ing of (r?.ingredients ?? [])) {
        if (ing?.name && !ingEmojiMap.has(ing.name)) {
          ingEmojiMap.set(ing.name, ING_EMOJI_FALLBACK(ing.name));
        }
      }
    }
  }
}

/** ====== 辞書テンプレを作る（B案） ====== */
function buildJaTemplate() {
  const out = { categories: {}, recipes: {}, ingredients: {} };

  for (const c of (data ?? [])) {
    if (c?.title) out.categories[c.title] = out.categories[c.title] ?? "";
  }
  for (const c of (data ?? [])) {
    for (const r of (c?.recipes ?? [])) {
      if (r?.name) out.recipes[r.name] = out.recipes[r.name] ?? "";
      for (const ing of (r?.ingredients ?? [])) {
        if (ing?.name) out.ingredients[ing.name] = out.ingredients[ing.name] ?? "";
      }
    }
  }

  const sortObj = (obj) => Object.fromEntries(
    Object.keys(obj).sort((a,b)=>a.localeCompare(b,"en")).map(k=>[k,obj[k]])
  );
  out.categories = sortObj(out.categories);
  out.recipes = sortObj(out.recipes);
  out.ingredients = sortObj(out.ingredients);
  return out;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    alert("コピーしました！\nGitHubの ja.json に貼り付けてOKです。");
  } catch {
    // クリップボードがダメな時は、promptで出す
    prompt("この内容をコピーして ja.json に貼ってね", text);
  }
}

/** ====== 起動 ====== */
async function init(tryOnlineFirst = false) {
  // 1) キャッシュ読み込み
  const cached = loadDataFromLocalStorage();
  const savedTime = getSavedTime();

  // 2) ja（まず保存→次にネットのja.json）
  ja = loadJaFromLocalStorage() ?? { categories:{}, recipes:{}, ingredients:{} };
  const jaFromNet = await fetchJa();
  // ネットのja.jsonが空じゃないなら上書きして保存
  if (jaFromNet && (Object.keys(jaFromNet.categories).length || Object.keys(jaFromNet.recipes).length || Object.keys(jaFromNet.ingredients).length)) {
    ja = jaFromNet;
    saveJaToLocalStorage(ja);
  }

  if (cached) {
    data = cached;
    rebuildIconMapFromData();
    renderCategories();
    setStatus(true, `保存データで表示中（保存日時: ${savedTime ? formatTime(savedTime) : "不明"}）`);
  } else {
    setStatus(false, "保存データなし。ネットで最新を取得します。");
  }

  // 3) 献立復元
  plan = loadPlan();
  renderPlan();
  renderSummary();

  // 4) ネットで最新
  if (tryOnlineFirst || !cached) {
    try {
      const latest = await fetchLatestRecipes();
      data = latest;
      saveDataToLocalStorage(latest);
      rebuildIconMapFromData();
      renderCategories();
      setStatus(true, `✅ 最新データに更新しました（取得: ${formatTime(Date.now())}）`);
      renderPlan();
      renderSummary();
    } catch (e) {
      console.error(e);
      if (cached) {
        setStatus(false, "ネット取得に失敗。でも保存データで動いています（オフラインかも）");
      } else {
        setStatus(false, "ネット取得に失敗。下の「貼り付け」から読み込んでね。");
      }
    }
  }
}

/** ====== イベント ====== */
categorySel.addEventListener("change", renderRecipeOptions);

$("#add").addEventListener("click", () => {
  if (!data.length) { alert("まだレシピが読み込めていないよ！"); return; }
  const catIdx = Number(categorySel.value);
  const recIdx = Number(recipeSel.value);
  const cat = data[catIdx];
  const recipe = cat?.recipes?.[recIdx];
  if (!cat || !recipe) return;

  const times = Math.max(1, Math.min(99, Number(timesInput.value || 1)));
  // ★英語で保存（そうするとレシピ更新に強い）
  plan.push({ catEn: cat.title, recipeEn: recipe.name, times });
  renderPlan();
  renderSummary();
  savePlan();
});

$("#clearAll").addEventListener("click", () => {
  if (!confirm("献立を全てクリアしますか？")) return;
  plan = [];
  renderPlan();
  renderSummary();
  savePlan();
});

$("#copy").addEventListener("click", () => {
  copySummary().catch(() => alert("コピーに失敗（許可が必要な場合があります）"));
});
$("#download").addEventListener("click", downloadCSV);

$("#refresh").addEventListener("click", () => init(true));

$("#clearCache").addEventListener("click", () => {
  if (!confirm("保存したレシピデータ・日本語辞書・献立を消します。いい？")) return;
  localStorage.removeItem(LS_KEY_DATA);
  localStorage.removeItem(LS_KEY_DATA_TIME);
  localStorage.removeItem(LS_KEY_PLAN);
  localStorage.removeItem(LS_KEY_JA);
  alert("消しました。ページを開き直してね。");
});

$("#loadPaste").addEventListener("click", () => {
  const t = $("#pasteArea").value.trim();
  if (!t) { alert("貼り付けが空っぽだよ"); return; }
  try {
    const json = JSON.parse(t);
    if (!Array.isArray(json) || !json.length) throw new Error("形が変");
    data = json;
    saveDataToLocalStorage(json);
    rebuildIconMapFromData();
    renderCategories();
    setStatus(true, "✅ 貼り付けから読み込みOK（保存しました）");
    renderPlan();
    renderSummary();
  } catch (e) {
    console.error(e);
    alert("JSONの読み込みに失敗したよ");
    setStatus(false, "貼り付け読み込みに失敗");
  }
});

$("#makeDict").addEventListener("click", async () => {
  if (!data?.length) { alert("先に「🔄 最新データを読み込む」を押してね"); return; }
  const tmpl = buildJaTemplate();
  const jsonText = JSON.stringify(tmpl, null, 2);
  await copyText(jsonText);
});

// 起動
init(false);
</script>
</body>
</html>
